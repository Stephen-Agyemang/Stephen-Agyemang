<svg fill="none" viewBox="0 0 1200 195" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="0" y="0" width="1200" height="195">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes rotate-gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        @keyframes pulse-glow {
          0%, 100% { box-shadow: 0 0 12px rgba(0, 242, 254, 0.15), 0 0 25px rgba(79, 172, 254, 0.08); }
          50% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3), 0 0 40px rgba(79, 172, 254, 0.2); }
        }

        @keyframes float-grid {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-3px); }
        }

        .container {
          width: 1200px;
          height: 170px;
          background: #0B0F19;
          font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          position: relative;
          overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.06);
          border-radius: 12px;
          box-sizing: border-box;
          animation: pulse-glow 6s infinite ease-in-out;
        }

        .grid-background {
          position: absolute;
          top: -40%;
          left: -10%;
          width: 120%;
          height: 180%;
          background-image: 
            linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
          background-size: 30px 30px;
          transform: perspective(500px) rotateX(15deg);
          animation: float-grid 8s infinite ease-in-out;
          z-index: 1;
        }

        .glow-circle-1 {
          position: absolute;
          width: 400px;
          height: 400px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(0, 242, 254, 0.1) 0%, transparent 70%);
          top: -150px;
          left: -50px;
          z-index: 2;
        }

        .glow-circle-2 {
          position: absolute;
          width: 400px;
          height: 400px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(79, 172, 254, 0.08) 0%, transparent 70%);
          bottom: -150px;
          right: -50px;
          z-index: 2;
        }

        .content {
          position: relative;
          z-index: 10;
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
        }

        .tag {
          font-size: 9px;
          text-transform: uppercase;
          letter-spacing: 3px;
          color: #00F2FE;
          font-weight: 700;
          background: rgba(0, 242, 254, 0.06);
          padding: 3px 10px;
          border-radius: 20px;
          border: 1px solid rgba(0, 242, 254, 0.15);
          margin-bottom: 8px;
        }

        .title {
          font-size: 36px;
          font-weight: 800;
          letter-spacing: -0.5px;
          margin: 0 0 4px 0;
          background: linear-gradient(135deg, #FFFFFF 30%, #A5B4FC 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .subtitle {
          font-size: 14px;
          color: #94A3B8;
          font-weight: 400;
          letter-spacing: 0.5px;
          margin-bottom: 12px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .subtitle::before, .subtitle::after {
          content: '';
          display: inline-block;
          width: 15px;
          height: 1px;
          background: linear-gradient(90deg, transparent, #4FACFE);
        }
        .subtitle::after {
          background: linear-gradient(90deg, #4FACFE, transparent);
        }

        .status-container {
          display: flex;
          gap: 12px;
        }

        .status-item {
          font-size: 10px;
          color: #E2E8F0;
          background: rgba(255, 255, 255, 0.02);
          border: 1px solid rgba(255, 255, 255, 0.04);
          padding: 3px 10px;
          border-radius: 6px;
          display: flex;
          align-items: center;
          gap: 5px;
        }

        .dot {
          width: 5px;
          height: 5px;
          background-color: #00F2FE;
          border-radius: 50%;
          box-shadow: 0 0 5px #00F2FE;
        }
      </style>
      <div class="container">
        <div class="grid-background"></div>
        <div class="glow-circle-1"></div>
        <div class="glow-circle-2"></div>
        <div class="content">
          <div class="tag">System Online</div>
          <h1 class="title">STEPHEN AGYEMANG</h1>
          <div class="subtitle">Software Engineer &amp; Tech Enthusiast</div>
          <div class="status-container">
            <div class="status-item">
              <span class="dot"></span>
              <span>Building digital experiences</span>
            </div>
            <div class="status-item" style="border-color: rgba(79, 172, 254, 0.1)">
              <span class="dot" style="background-color: #4FACFE; box-shadow: 0 0 5px #4FACFE"></span>
              <span>Always learning</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
